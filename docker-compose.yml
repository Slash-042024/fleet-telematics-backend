services:
  postgres:
    image: postgres:16-alpine
    container_name: telematics-postgres
    environment:
      POSTGRES_DB: telematics_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - telematics-net

  backend:
    build: .
    container_name: telematics-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/telematics_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password123
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    depends_on:
      - postgres
    networks:
      - telematics-net

volumes:
  postgres_data:

networks:
  telematics-net:
    driver: bridge